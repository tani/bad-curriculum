name: Verify Adam upper-layer proofs

on:
  push:
    branches: [proof/adam-adamw-upper-layers-20260917]
    paths:
      - formalization/**
      - .github/workflows/adam-proof-check.yml

permissions:
  contents: read

jobs:
  runtime:
    if: contains(github.event.head_commit.message, '[runtime]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: makarius/isabelle:Isabelle2025-2_X11_Latex
    steps:
      - name: Export pinned proof-checking components
        shell: bash
        run: |
          set -eu
          mkdir -p proof-runtime
          HOME_DIR=$(/home/isabelle/Isabelle/bin/isabelle getenv -b ISABELLE_HOME)
          /home/isabelle/Isabelle/bin/isabelle version
          tar -czf proof-runtime/isabelle-contrib.tar.gz --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff*' -C "$HOME_DIR" contrib
          split -b 250M -d proof-runtime/isabelle-contrib.tar.gz proof-runtime/contrib.part
          du -h proof-runtime/*
      - uses: actions/upload-artifact@v4
        with:
          name: proof-components-00
          path: proof-runtime/contrib.part00
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: proof-components-01
          path: proof-runtime/contrib.part01
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: proof-components-02
          path: proof-runtime/contrib.part02
          compression-level: 0
          retention-days: 1
  verify:
    if: "!contains(github.event.head_commit.message, '[runtime]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: makarius/isabelle:Isabelle2025-2_X11_Latex
    steps:
      - uses: actions/checkout@v4
      - name: Export exact source input
        uses: actions/upload-artifact@v4
        with:
          name: proof-source-input
          path: formalization
          retention-days: 7
      - name: Verify the complete session
        shell: bash
        run: |
          set -o pipefail
          mkdir -p proof-logs
          /home/isabelle/Isabelle/bin/isabelle version | tee proof-logs/version.txt
          /home/isabelle/Isabelle/bin/isabelle build -v -o threads=2 -o parallel_proofs=0 -D formalization Bad_Curriculum 2>&1 | tee proof-logs/build.log
      - name: Export source and verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-source-and-logs
          path: |
            formalization
            proof-logs
          retention-days: 7
