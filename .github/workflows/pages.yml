name: Build and deploy Isabelle/HOL documentation

on:
  push:
    branches: [master]
    paths:
      - formalization/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-document:
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2_X11_Latex
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Isabelle/HOL HTML browser information
        run: |
          mkdir -p build/presentation site
          /home/isabelle/Isabelle/bin/isabelle build -P build/presentation -D formalization -o browser_info Bad_Curriculum
          cp -a build/presentation/. site/
          cp -a build/presentation/Unsorted/Bad_Curriculum/. site/

      - name: Upload site input
        uses: actions/upload-artifact@v4
        with:
          name: pages-site
          path: site

  deploy:
    needs: build-document
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site input
        uses: actions/download-artifact@v4
        with:
          name: pages-site
          path: site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
