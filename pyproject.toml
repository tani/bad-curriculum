[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "yelp-inversion"
version = "1.1.0"
description = "Strict order-only inversion experiment on Yelp Polarity"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yelp Inversion contributors" }]
dependencies = [
  "datasets>=3.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "torch>=2.2",
]

[project.scripts]
yelp-inversion = "yelp_inversion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yelp_inversion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
