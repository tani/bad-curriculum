[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bad-curriculum"
version = "1.1.0"
description = "Strict order-only curriculum attack experiment on Yelp Polarity"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bad Curriculum contributors" }]
dependencies = [
  "datasets>=3.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "torch>=2.2",
]

[project.scripts]
bad-curriculum = "bad_curriculum.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bad_curriculum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
